<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">構成案B 10こカップが並ぶゼリー工場メーター</title>
  <desc id="desc">スマホ横向き画面で、上部に10個の大きなカップを横並びにし、10個単位でゼリーが満ちる進捗を見せる案。</desc>
  <defs>
    <linearGradient id="bgB" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f5fdff"/>
      <stop offset="0.5" stop-color="#fff9e7"/>
      <stop offset="1" stop-color="#fff0f5"/>
    </linearGradient>
    <linearGradient id="cupFill" x1="0" x2="0" y1="1" y2="0">
      <stop offset="0" stop-color="#f34f6d"/>
      <stop offset="0.52" stop-color="#ff8fac"/>
      <stop offset="1" stop-color="#ffd2d9"/>
    </linearGradient>
    <linearGradient id="cupGlass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#dff8ff" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="plateB" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff0cd"/>
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#433326" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgB)"/>

  <g transform="translate(24 24)">
