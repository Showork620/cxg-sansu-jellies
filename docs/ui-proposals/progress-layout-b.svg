    <circle cx="34" cy="23" r="5" fill="#5b4f45"/>
    <circle cx="54" cy="23" r="5" fill="#5b4f45"/>
    <circle cx="74" cy="23" r="5" fill="#5b4f45"/>
  </g>

  <g filter="url(#shadowB)">
