      <stop offset="0" stop-color="#ff8fac"/>
      <stop offset="0.48" stop-color="#ffcf45"/>
      <stop offset="1" stop-color="#7edb78"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1cf"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#433326" flood-opacity="0.15"/>
