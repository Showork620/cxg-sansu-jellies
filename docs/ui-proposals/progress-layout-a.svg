<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">構成案A 横幅いっぱいのゼリー川メーター</title>
  <desc id="desc">スマホ横向き画面で、上部に横幅いっぱいの大きな進捗メーター、中央に皿、下部に回答ボタン、右側にキャラクターを配置した案。</desc>
  <defs>
